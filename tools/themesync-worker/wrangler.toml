name = "ereaderds-themes"
main = "worker.js"
compatibility_date = "2026-01-01"

# After `npx wrangler d1 create ereaderds-themes`, paste its id here, then
# `npx wrangler d1 execute ereaderds-themes --remote --file=schema.sql`.
[[d1_databases]]
binding = "DB"
database_name = "ereaderds-themes"
database_id = "e4302def-1677-45a3-b335-68cbeba5992b"

# At most 60 requests a minute from one address.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 60
  period = 60

# At most 5 new codes a minute from one address.
[[ratelimits]]
name = "NEWLIM"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 5
  period = 60
