name: Release

# Push a tag like v0.1.0 to build the SD card zip and publish it as a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^return "\(.*\)"$/\1/p' app/version.lua)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "app/version.lua is $v but tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Build zip
        id: build
        run: echo "zip=$(tools/build-release.sh | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: eReaderDS
          path: ${{ steps.build.outputs.zip }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "${GITHUB_REF_NAME}" "${{ steps.build.outputs.zip }}" \
            --title "eReaderDS ${GITHUB_REF_NAME}" --notes "${notes:-See CHANGELOG.md}" --prerelease
