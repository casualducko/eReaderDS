name: Bug report
description: Something doesn't work or looks wrong on the device
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for testing! The log file makes most problems quick to fix.
  - type: input
    id: version
    attributes:
      label: eReaderDS version
      description: Shown at the top of Settings and at the bottom of the Library (e.g. v0.1.0).
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device and firmware
      description: eReaderDS is made for the RG DS Plus on its stock firmware or ROCKNIX.
      options:
        - RG DS Plus, stock firmware
        - RG DS Plus, ROCKNIX
        - Something else (tell us below)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Photos of the screens help.
    validations:
      required: true
  - type: input
    id: book
    attributes:
      label: Book (if it's about one book)
      description: Title and where it came from (e.g. Project Gutenberg, Calibre conversion). No need to attach the book.
  - type: textarea
    id: log
    attributes:
      label: log.txt
      description: Contents of Ports/eReaderDS/log.txt on the SD card, copied right after the problem. (A report from the app's QR code fills in where it went wrong.)
      render: text
